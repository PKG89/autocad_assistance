#!/usr/sbin/nft -f
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    iifname "eth0" ip saddr 192.168.1.0/24 tcp dport 22 accept
    iifname "eth0" udp sport 67 udp dport 68 accept
    iifname "eth0" udp dport 51820 accept
    iifname "wt0" ip saddr { 100.104.97.169, 100.104.100.176 } tcp dport { 22, 443 } accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
